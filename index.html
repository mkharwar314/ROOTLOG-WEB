  <script>
    // =========================================================================
    // 1. DEFAULT CONFIG & FALLBACK SAMPLE NOTES
    // =========================================================================
    const STORAGE_KEY = 'gitvault_config_v2';

    const DEFAULT_CONFIG = {
      owner: 'mkharwar314',
      repo: 'rootlog',
      branch: 'main',
      token: ''
    };

    const DEMO_NOTES = [
      {
        path: 'README.md',
        sha: 'demo-readme',
        content: `---
title: rootlog
date: 2026-11-22
tags: [notes, markdown, github]
---

A distraction-free Markdown reader connected to \`mkharwar314/rootlog\`.

> [!NOTE]
> Currently displaying offline sample notes. Click **rootlog** or the settings icon in the top bar to reconnect or update your GitHub repository settings.

## Features

- [x] Rich Markdown rendering with YAML frontmatter and task lists
- [x] Obsidian-style \`[[WikiLinks]]\` and GitHub callout blocks
- [x] Interactive **Graph View** (click the graph icon in the top bar or press \`G\`)
- [x] Relative image and internal document link resolution
- [x] Keyboard shortcuts (\`/\` or \`Cmd+K\` to search, \`Esc\` to close dialogs)

## Linked Guides

- [[Guides/Nmap-Enumeration|Nmap Enumeration]]
- [[Guides/Privilege-Escalation|Linux Privilege Escalation]]

## Quick Reference

| Shortcut | Action |
| :--- | :--- |
| \`/\` or \`Cmd + K\` | Filter notes in sidebar |
| \`G\` | Toggle Knowledge Graph View |
| \`Esc\` | Close modal or graph |
`
      },
      {
        path: 'Guides/Nmap-Enumeration.md',
        sha: 'demo-nmap',
        content: `---
title: Nmap Enumeration
category: Security
tags: [nmap, recon]
---

Systematic port scanning and service discovery workflow. Return to [[README|rootlog]] or continue to [[Guides/Privilege-Escalation|Privilege Escalation]].

> [!TIP]
> Save scan output in all formats using \`-oA scan_name\` for easy parsing later.

## Two-Stage Scan

\`\`\`bash
export TARGET=10.10.142.88
nmap -p- --min-rate 5000 -Pn -n $TARGET -oN all_ports.nmap
\`\`\`

Run targeted NSE scripts and version detection on discovered ports:

\`\`\`bash
PORTS=$(grep '^[0-9]' all_ports.nmap | cut -d '/' -f 1 | tr '\\n' ',' | sed 's/,$//')
nmap -sC -sV -p $PORTS -Pn $TARGET -oN detailed.nmap
\`\`\`
`
      },
      {
        path: 'Guides/Privilege-Escalation.md',
        sha: 'demo-privesc',
        content: `---
title: Linux Privilege Escalation
category: Security
tags: [linux, privesc]
---

Post-exploitation enumeration checklist following [[Guides/Nmap-Enumeration|Nmap Enumeration]].

- [ ] Check \`sudo -l\` permissions
- [ ] Inspect SUID/SGID binaries (\`find / -perm -4000 2>/dev/null\`)
- [ ] Review scheduled cron jobs in \`/etc/crontab\`
`
      }
    ];

    // =========================================================================
    // 2. APPLICATION STATE
    // =========================================================================
    let state = {
      config: { ...DEFAULT_CONFIG },
      isDemoMode: false,
      files: [],
      contentCache: {},
      activePath: null,
      viewMode: 'rendered',
      forceMarkdownTxt: false,
      searchQuery: '',
      sidebarCollapsed: false,
      expandedFolders: new Set(),
      graphOpen: false,
      graphLocalOnly: false,
      graphSimulation: null,
      graphZoomBehavior: null,
      isIndexingGraph: false,
      heroSearchIndex: -1
    };

    // =========================================================================
    // 3. INITIALIZATION, CONFIG & KEYBOARD / TOUCH CONTROLS
    // =========================================================================
    function loadConfigFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.config = { ...DEFAULT_CONFIG, ...parsed };
        }
      } catch (e) {
        state.config = { ...DEFAULT_CONFIG };
      }

      const ownerEl = document.getElementById('input-owner');
      const repoEl = document.getElementById('input-repo');
      const branchEl = document.getElementById('input-branch');
      const tokenEl = document.getElementById('input-token');

      if (ownerEl) ownerEl.value = state.config.owner || 'mkharwar314';
      if (repoEl) repoEl.value = state.config.repo || 'rootlog';
      if (branchEl) branchEl.value = state.config.branch || 'main';
      if (tokenEl) tokenEl.value = state.config.token || '';
    }

    function saveConfigToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.config));
      } catch (e) {
        // Ignore storage quota errors
      }
    }

    function setupTouchGestures() {
      let startX = 0;
      let startY = 0;

      document.addEventListener('touchstart', (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;

        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5 && window.innerWidth < 1024) {
          if (startX < 36 && dx > 0) {
            toggleSidebar(true);
          } else if (dx < 0) {
            toggleSidebar(false);
          }
        }
      }, { passive: true });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadConfigFromStorage();
      setupKeyboardShortcuts();
      setupTouchGestures();
      setupHeroSearchDismiss();

      if (state.config.owner && state.config.repo) {
        connectToGitHubRepo(state.config);
      } else {
        activateDemoMode(false);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !state.isDemoMode && state.config.owner && state.config.repo) {
        connectToGitHubRepo(state.config, true);
      }
    });

    function setupHeroSearchDismiss() {
      document.addEventListener('click', (e) => {
        const wrapper = document.getElementById('hero-search-wrapper');
        if (wrapper && !wrapper.contains(e.target)) {
          closeHeroSearchResults();
        }
      });
    }

    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;

        if ((e.key === '/' && !isTyping) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
          e.preventDefault();
          focusSearchInput();
          return;
        }

        if (e.key.toLowerCase() === 'g' && !isTyping && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          toggleGraphView();
          return;
        }

        if (e.key === '[' && !isTyping && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          switchNoteByOffset(-1);
          return;
        }

        if (e.key === ']' && !isTyping && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          switchNoteByOffset(1);
          return;
        }

        if (e.key === 'Escape') {
          const dropdown = document.getElementById('hero-search-dropdown');
          if (dropdown && !dropdown.classList.contains('hidden')) {
            closeHeroSearchResults();
            return;
          }
          const modal = document.getElementById('setup-modal');
          if (modal && !modal.classList.contains('hidden')) {
            closeSetupModal();
            return;
          }
          if (state.graphOpen) {
            toggleGraphView(false);
            return;
          }
          if (window.innerWidth < 1024) {
            toggleSidebar(false);
          }
        }
      });
    }

    function focusSearchInput() {
      if (state.graphOpen) {
        toggleGraphView(false);
      }
      const heroInput = document.getElementById('hero-search-input');
      if (heroInput) {
        heroInput.focus();
        heroInput.select();
        openHeroSearchResults();
        return;
      }
      const input = document.getElementById('search-input');
      if (input) {
        input.focus();
        input.select();
      }
    }

    // =========================================================================
    // 4. GITHUB REST API INTEGRATION
    // =========================================================================
    function getGitHubHeaders() {
      const headers = {
        Accept: 'application/vnd.github.v3+json'
      };
      if (state.config.token && state.config.token.trim()) {
        headers.Authorization = `Bearer ${state.config.token.trim()}`;
      }
      return headers;
    }

    async function connectToGitHubRepo(cfg, silent = false) {
      const owner = (cfg.owner || '').trim();
      const repo = (cfg.repo || '').trim();
      let branch = (cfg.branch || 'main').trim();

      if (!owner || !repo) {
        activateDemoMode(false);
        return;
      }

      const previousPath = state.activePath;
      if (!silent) {
        setLoadingState(true);
      }

      try {
        const headers = getGitHubHeaders();
        let treeUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`;
        let res = await fetch(treeUrl, { headers, cache: 'no-store' });

        // Auto-fallback from main -> master if needed
        if (res.status === 404 && branch === 'main') {
          branch = 'master';
          treeUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/master?recursive=1`;
          res = await fetch(treeUrl, { headers, cache: 'no-store' });
        }

        if (!res.ok) {
          if (res.status === 404) {
            throw new Error(`Repository "${owner}/${repo}" not found or is private (add a token in settings).`);
          }
          if (res.status === 401 || res.status === 403) {
            throw new Error('GitHub API access denied or rate-limited. Check your Personal Access Token.');
          }
          throw new Error(`GitHub API error (${res.status}).`);
        }

        const data = await res.json();
        const noteFiles = (data.tree || [])
          .filter(item => item.type === 'blob' && /\.(md|markdown|mdx|txt)$/i.test(item.path))
          .map(item => ({ path: item.path, sha: item.sha }))
          .sort((a, b) => a.path.localeCompare(b.path));

        if (noteFiles.length === 0) {
          throw new Error(`No Markdown or text notes found in "${owner}/${repo}".`);
        }

        state.isDemoMode = false;
        state.config = { ...cfg, owner, repo, branch };
        saveConfigToStorage();

        // Invalidate stale cache entries whose SHA changed
        const newShaMap = new Map(noteFiles.map(f => [f.path, f.sha]));
        Object.keys(state.contentCache).forEach(cachedPath => {
          if (!newShaMap.has(cachedPath)) {
            delete state.contentCache[cachedPath];
          }
        });
        state.files = noteFiles;

        const headerRepoEl = document.getElementById('header-repo-name');
        if (headerRepoEl) headerRepoEl.textContent = repo;
        hideBanner();
        setLoadingState(false);

        renderFileTree();
        updateNoteSwitcherUI();

        const targetNote =
          (previousPath && noteFiles.find(f => f.path === previousPath)) ||
          noteFiles.find(f => /(^|\/)readme\.md$/i.test(f.path)) ||
          noteFiles[0];
        await selectNote(targetNote.path, silent);

        if (state.graphOpen) {
          openGraphAndIndex();
        }
      } catch (error) {
        setLoadingState(false);
        if (!silent) {
          showBanner(`${error.message} Showing sample notes.`);
          activateDemoMode(false, true);
        }
      }
    }

    function refreshRepository() {
      state.contentCache = {};
      if (state.config.owner && state.config.repo) {
        showToast('Syncing repository...');
        connectToGitHubRepo(state.config);
      } else {
        activateDemoMode(true);
      }
    }

    async function fetchNoteContent(path) {
      if (state.isDemoMode) {
        return state.contentCache[path] || '';
      }
      if (Object.prototype.hasOwnProperty.call(state.contentCache, path)) {
        return state.contentCache[path];
      }

      const { owner, repo, branch } = state.config;
      const encodedPath = path.split('/').map(encodeURIComponent).join('/');
      const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`;

      const res = await fetch(url, {
        headers: {
          ...getGitHubHeaders(),
          Accept: 'application/vnd.github.v3.raw'
        },
        cache: 'no-store'
      });

      if (!res.ok) {
        throw new Error(`Failed to fetch ${path} (${res.status})`);
      }

      const text = await res.text();
      state.contentCache[path] = text;
      return text;
    }

    async function discoverUserRepos() {
      const ownerInput = document.getElementById('input-owner');
      const tokenInput = document.getElementById('input-token');
      const pickerBox = document.getElementById('repo-picker-box');
      const pickerList = document.getElementById('repo-picker-list');

      const owner = (ownerInput ? ownerInput.value : '').trim() || 'mkharwar314';
      const token = (tokenInput ? tokenInput.value : '').trim();

      if (!pickerBox || !pickerList) return;

      pickerBox.classList.remove('hidden');
      pickerList.innerHTML = `<div class="px-2 py-1.5 text-muted">Fetching repositories...</div>`;

      try {
        const headers = { Accept: 'application/vnd.github.v3+json' };
        if (token) headers.Authorization = `Bearer ${token}`;

        const endpoint = token
          ? 'https://api.github.com/user/repos?per_page=100&sort=updated'
          : `https://api.github.com/users/${encodeURIComponent(owner)}/repos?per_page=100&sort=updated`;

        const res = await fetch(endpoint, { headers, cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const repos = await res.json();
        if (!Array.isArray(repos) || repos.length === 0) {
          pickerList.innerHTML = `<div class="px-2 py-1.5 text-muted">No repositories found</div>`;
          return;
        }

        pickerList.innerHTML = repos.map(r => `
          <button
            type="button"
            onclick="pickDiscoveredRepo('${escapeHtml(r.owner.login)}', '${escapeHtml(r.name)}', '${escapeHtml(r.default_branch || 'main')}')"
            class="w-full text-left px-2 py-1.5 rounded hover:bg-surface text-ink flex items-center justify-between gap-2 transition"
          >
            <span class="truncate">${escapeHtml(r.name)}</span>
            <span class="text-[10px] text-muted shrink-0">${r.private ? 'private' : 'public'}</span>
          </button>
        `).join('');
      } catch (err) {
        pickerList.innerHTML = `<div class="px-2 py-1.5 text-muted">Could not list repos (${escapeHtml(err.message)})</div>`;
      }
    }

    function pickDiscoveredRepo(owner, repo, branch) {
      const ownerEl = document.getElementById('input-owner');
      const repoEl = document.getElementById('input-repo');
      const branchEl = document.getElementById('input-branch');
      const pickerBox = document.getElementById('repo-picker-box');

      if (ownerEl) ownerEl.value = owner;
      if (repoEl) repoEl.value = repo;
      if (branchEl) branchEl.value = branch || 'main';
      if (pickerBox) pickerBox.classList.add('hidden');
    }

    function saveAndConnectRepo(e) {
      e.preventDefault();
      const owner = (document.getElementById('input-owner')?.value || '').trim();
      const repo = (document.getElementById('input-repo')?.value || '').trim();
      const branch = (document.getElementById('input-branch')?.value || 'main').trim() || 'main';
      const token = (document.getElementById('input-token')?.value || '').trim();

      state.contentCache = {};
      closeSetupModal();
      connectToGitHubRepo({ owner, repo, branch, token });
    }

    function activateDemoMode(showNotification = true, keepBanner = false) {
      state.isDemoMode = true;
      state.files = DEMO_NOTES.map(n => ({ path: n.path, sha: n.sha }));
      state.contentCache = {};
      DEMO_NOTES.forEach(n => {
        state.contentCache[n.path] = n.content;
      });
      state.expandedFolders = new Set(['Guides']);

      const headerRepoEl = document.getElementById('header-repo-name');
      if (headerRepoEl) headerRepoEl.textContent = state.config.repo || 'rootlog';
      if (!keepBanner) hideBanner();

      updateNoteSwitcherUI();
      selectNote('README.md');

      if (showNotification) {
        closeSetupModal();
        showToast('Loaded sample notes');
      }

    // =========================================================================
    // 5. NOTE SELECTION, FRONTMATTER, WIKILINKS & MARKDOWN RENDERING
    // =========================================================================
    async function selectNote(path, preserveScroll = false) {
      if (!path) return;

      state.activePath = path;
      state.forceMarkdownTxt = false;

      // Expand parent folders in sidebar
      const segments = path.split('/');
      for (let i = 1; i < segments.length; i++) {
        state.expandedFolders.add(segments.slice(0, i).join('/'));
      }

      const breadcrumbEl = document.getElementById('breadcrumb-path');
      if (breadcrumbEl) breadcrumbEl.textContent = path;

      const ghLink = document.getElementById('open-github-link');
      if (ghLink) {
        const { owner, repo, branch } = state.config;
        ghLink.href = state.isDemoMode
          ? `https://github.com/${owner || 'mkharwar314'}/${repo || 'rootlog'}`
          : `https://github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/blob/${encodeURIComponent(branch)}/${path.split('/').map(encodeURIComponent).join('/')}`;
      }

      if (state.viewMode !== 'rendered') {
        setViewMode('rendered');
      }

      renderFileTree();
      updateNoteSwitcherUI();
      closeHeroSearchResults();

      if (window.innerWidth < 1024) {
        toggleSidebar(false);
      }

      setLoadingState(true);
      try {
        const rawText = await fetchNoteContent(path);
        setLoadingState(false);
        renderCurrentDocument(path, rawText);

        if (!preserveScroll) {
          const scrollContainer = document.getElementById('reader-scroll-container');
          if (scrollContainer) scrollContainer.scrollTop = 0;
        }
      } catch (err) {
        setLoadingState(false);
        const titleEl = document.getElementById('note-display-title');
        const mdEl = document.getElementById('markdown-output');
        if (titleEl) titleEl.textContent = path.split('/').pop();
        if (mdEl) {
          mdEl.innerHTML = `<p class="text-muted text-sm">Unable to load note: ${escapeHtml(err.message)}</p>`;
        }
      }
    }

    function parseFrontmatter(raw) {
      const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
      if (!match) {
        return { meta: {}, body: raw };
      }
      const meta = {};
      match[1].split(/\r?\n/).forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) {
          const key = line.slice(0, idx).trim().toLowerCase();
          let val = line.slice(idx + 1).trim();
          val = val.replace(/^["']|["']$/g, '');
          meta[key] = val;
        }
      });
      return { meta, body: raw.slice(match[0].length) };
    }

    function resolveWikiTarget(target) {
      const cleanTarget = target.split('#')[0].trim().replace(/\.md$/i, '').toLowerCase();
      if (!cleanTarget) return null;

      // Exact path match (with or without .md)
      const exact = state.files.find(f => f.path.replace(/\.(md|markdown|mdx)$/i, '').toLowerCase() === cleanTarget);
      if (exact) return exact.path;

      // Filename basename match
      const baseMatch = state.files.find(f => {
        const base = f.path.split('/').pop().replace(/\.(md|markdown|mdx)$/i, '').toLowerCase();
        return base === cleanTarget;
      });
      return baseMatch ? baseMatch.path : null;
    }

    function renderCurrentDocument(path, rawText) {
      const { meta, body } = parseFrontmatter(rawText);
      const fileName = path.split('/').pop();
      const fallbackTitle = fileName.replace(/\.(md|markdown|mdx|txt)$/i, '');

      const titleEl = document.getElementById('note-display-title');
      if (titleEl) titleEl.textContent = meta.title || fallbackTitle;

      // Subtle inline frontmatter metadata line
      const metaLineEl = document.getElementById('frontmatter-meta-line');
      if (metaLineEl) {
        const parts = [];
        if (meta.date) parts.push(meta.date);
        if (meta.category) parts.push(meta.category);
        if (meta.tags) {
          const cleanTags = meta.tags
            .replace(/^\[|\]$/g, '')
            .split(',')
            .map(t => t.trim())
            .filter(Boolean)
            .map(t => (t.startsWith('#') ? t : `#${t}`))
            .join(' ');
          if (cleanTags) parts.push(cleanTags);
        }
        if (parts.length > 0) {
          metaLineEl.textContent = parts.join(' · ');
          metaLineEl.classList.remove('hidden');
        } else {
          metaLineEl.classList.add('hidden');
          metaLineEl.textContent = '';
        }
      }

      const rawEl = document.getElementById('raw-output');
      if (rawEl) rawEl.textContent = rawText;

      const isTxt = /\.txt$/i.test(path);
      const txtNotice = document.getElementById('txt-render-notice');
      const forceBtn = document.getElementById('btn-force-md');
      if (txtNotice) txtNotice.classList.toggle('hidden', !isTxt);
      if (forceBtn) {
        forceBtn.textContent = state.forceMarkdownTxt ? 'View as plain text' : 'Render as Markdown';
      }

      const mdOutput = document.getElementById('markdown-output');
      if (!mdOutput) return;

      if (isTxt && !state.forceMarkdownTxt) {
        mdOutput.innerHTML = `<pre class="bg-sidebar border border-hairline rounded-md p-4 overflow-x-auto font-mono text-xs text-ink/90 leading-relaxed whitespace-pre-wrap break-words"><code>${escapeHtml(body)}</code></pre>`;
        return;
      }

      // Replace Obsidian [[WikiLinks]] with internal anchor tags before Marked parsing
      const preprocessed = body.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, alias) => {
        const label = (alias || target.split('/').pop()).trim();
        const resolved = resolveWikiTarget(target);
        if (resolved) {
          return `<a href="#note:${encodeURIComponent(resolved)}" class="wikilink-pill" data-note-path="${escapeHtml(resolved)}">${escapeHtml(label)}</a>`;
        }
        return `<span class="wikilink-pill opacity-75">${escapeHtml(label)}</span>`;
      });

      let html = typeof marked !== 'undefined'
        ? marked.parse(preprocessed, { gfm: true, breaks: false })
        : `<pre>${escapeHtml(preprocessed)}</pre>`;

      if (typeof DOMPurify !== 'undefined') {
        html = DOMPurify.sanitize(html, {
          ADD_ATTR: ['data-note-path', 'target', 'rel']
        });
      }

      mdOutput.innerHTML = html;
      enhanceRenderedMarkdown(mdOutput, path);
    }

    function enhanceRenderedMarkdown(container, notePath) {
      // 1. Transform GitHub Callout Blockquotes (> [!NOTE], > [!TIP], etc.)
      container.querySelectorAll('blockquote').forEach(bq => {
        const firstP = bq.querySelector('p');
        if (!firstP) return;
        const match = firstP.innerHTML.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>|\n)?/i);
        if (match) {
          const type = match[1].toUpperCase();
          firstP.innerHTML = firstP.innerHTML.slice(match[0].length);
          const wrapper = document.createElement('div');
          wrapper.className = 'markdown-callout';
          wrapper.innerHTML = `<div class="markdown-callout-title">${type}</div>`;
          while (bq.firstChild) {
            wrapper.appendChild(bq.firstChild);
          }
          bq.replaceWith(wrapper);
        }
      });

      // 2. Wrap tables for responsive horizontal scrolling
      container.querySelectorAll('table').forEach(table => {
        if (table.parentElement && table.parentElement.classList.contains('markdown-table-wrap')) return;
        const wrap = document.createElement('div');
        wrap.className = 'markdown-table-wrap';
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });

      // 3. Syntax highlight code blocks & attach minimal copy button
      container.querySelectorAll('pre code').forEach(block => {
        if (typeof hljs !== 'undefined') {
          try {
            hljs.highlightElement(block);
          } catch (e) {
            // Ignore unknown languages
          }
        }
        const pre = block.parentElement;
        if (!pre || pre.querySelector('.copy-code-btn')) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-code-btn absolute top-2 right-2 px-2.5 py-1 sm:px-2 sm:py-0.5 rounded bg-canvas/90 hover:bg-surface active:bg-surface border border-hairline text-[11px] sm:text-[10px] font-mono text-muted hover:text-accent transition';
        btn.textContent = 'copy';
        btn.addEventListener('click', () => {
          copyTextFallback(block.innerText);
          btn.textContent = 'copied';
          setTimeout(() => { btn.textContent = 'copy'; }, 1400);
        });
        pre.appendChild(btn);
      });

      // 4. Resolve internal links & WikiLinks
      container.querySelectorAll('a').forEach(anchor => {
        const directNote = anchor.getAttribute('data-note-path');
        if (directNote) {
          anchor.addEventListener('click', (e) => {
            e.preventDefault();
            selectNote(directNote);
          });
          return;
        }

        const href = anchor.getAttribute('href') || '';
        if (!href || href.startsWith('#')) return;

        if (/^https?:\/\//i.test(href)) {
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          return;
        }

        const resolvedRelative = resolveRelativePath(notePath, href.split('#')[0]);
        const matchedFile = state.files.find(f => f.path.toLowerCase() === resolvedRelative.toLowerCase());
        if (matchedFile) {
          anchor.addEventListener('click', (e) => {
            e.preventDefault();
            selectNote(matchedFile.path);
          });
        }
      });

      // 5. Resolve relative images (including private repository images via GitHub API)
      container.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        if (!src || /^https?:\/\/|^data:/i.test(src) || state.isDemoMode) return;

        const resolvedImgPath = resolveRelativePath(notePath, src);
        const { owner, repo, branch, token } = state.config;
        const encoded = resolvedImgPath.split('/').map(encodeURIComponent).join('/');

        if (token && token.trim()) {
          fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encoded}?ref=${encodeURIComponent(branch)}`, {
            headers: {
              ...getGitHubHeaders(),
              Accept: 'application/vnd.github.v3.raw'
            }
          })
            .then(r => (r.ok ? r.blob() : Promise.reject()))
            .then(blob => {
              img.src = URL.createObjectURL(blob);
            })
            .catch(() => {});
        } else {
          img.src = `https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${encodeURIComponent(branch)}/${encoded}`;
        }
      });
    }

    function resolveRelativePath(baseNotePath, relHref) {
      const baseParts = baseNotePath.split('/').slice(0, -1);
      const relParts = decodeURIComponent(relHref).split('/');
      for (const part of relParts) {
        if (!part || part === '.') continue;
        if (part === '..') {
          baseParts.pop();
        } else {
          baseParts.push(part);
        }
      }
      return baseParts.join('/');
    }

    function toggleRawView() {
      setViewMode(state.viewMode === 'rendered' ? 'raw' : 'rendered');
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const mdEl = document.getElementById('markdown-output');
      const rawWrap = document.getElementById('raw-output-container');
      const btn = document.getElementById('btn-toggle-raw');

      if (mdEl) mdEl.classList.toggle('hidden', mode === 'raw');
      if (rawWrap) rawWrap.classList.toggle('hidden', mode !== 'raw');
      if (btn) btn.textContent = mode === 'raw' ? 'rendered' : 'raw';
    }

    function toggleForceMarkdownOnTxt() {
      state.forceMarkdownTxt = !state.forceMarkdownTxt;
      if (state.activePath && Object.prototype.hasOwnProperty.call(state.contentCache, state.activePath)) {
        renderCurrentDocument(state.activePath, state.contentCache[state.activePath]);
      }
    }

    // =========================================================================
    // 6. QUIET DIRECTORY TREE, HERO SEARCH & NOTES SWITCH SYSTEM
    // =========================================================================
    function handleSearchInput(val, source = 'sidebar') {
      state.searchQuery = val.trim().toLowerCase();
      state.heroSearchIndex = -1;

      const sidebarInput = document.getElementById('search-input');
      const heroInput = document.getElementById('hero-search-input');
      if (source !== 'sidebar' && sidebarInput && sidebarInput.value !== val) {
        sidebarInput.value = val;
      }
      if (source !== 'hero' && heroInput && heroInput.value !== val) {
        heroInput.value = val;
      }

      const hasQuery = state.searchQuery.length > 0;
      const clearBtn = document.getElementById('clear-search-btn');
      const heroClearBtn = document.getElementById('hero-clear-search-btn');
      if (clearBtn) clearBtn.classList.toggle('hidden', !hasQuery);
      if (heroClearBtn) heroClearBtn.classList.toggle('hidden', !hasQuery);

      renderFileTree();
      if (source === 'hero' || hasQuery) {
        renderHeroSearchDropdown();
      }
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      const heroInput = document.getElementById('hero-search-input');
      if (input) input.value = '';
      if (heroInput) heroInput.value = '';
      handleSearchInput('', 'clear');
      closeHeroSearchResults();
    }

    function openHeroSearchResults() {
      renderHeroSearchDropdown();
    }

    function closeHeroSearchResults() {
      const dropdown = document.getElementById('hero-search-dropdown');
      if (dropdown) dropdown.classList.add('hidden');
      state.heroSearchIndex = -1;
    }

    function renderHeroSearchDropdown() {
      const dropdown = document.getElementById('hero-search-dropdown');
      const resultsEl = document.getElementById('hero-search-results');
      if (!dropdown || !resultsEl) return;

      const matches = getFilteredFiles().slice(0, 10);
      dropdown.classList.remove('hidden');

      if (matches.length === 0) {
        resultsEl.innerHTML = `<div class="px-3.5 py-3 text-xs text-muted">No matching notes found</div>`;
        return;
      }

      resultsEl.innerHTML = matches.map((file, idx) => {
        const parts = file.path.split('/');
        const title = parts[parts.length - 1].replace(/\.(md|markdown|mdx|txt)$/i, '');
        const folder = parts.length > 1 ? parts.slice(0, -1).join('/') : 'root';
        const isActive = file.path === state.activePath;
        const isHighlighted = idx === state.heroSearchIndex;

        return `
          <button
            type="button"
            onclick="selectNote('${escapeHtml(file.path)}')"
            class="w-full px-3.5 py-2.5 text-left flex items-center justify-between gap-3 transition ${
              isHighlighted ? 'bg-surface' : 'hover:bg-surface/70'
            }"
          >
            <div class="min-w-0">
              <div class="text-xs font-medium truncate ${isActive ? 'text-accent' : 'text-ink'}">${escapeHtml(title)}</div>
              <div class="text-[11px] font-mono text-muted truncate">${escapeHtml(folder)}</div>
            </div>
            ${isActive ? '<span class="text-[10px] font-mono text-accent shrink-0">active</span>' : ''}
          </button>
        `;
      }).join('');
    }

    function handleHeroSearchKeydown(e) {
      const matches = getFilteredFiles().slice(0, 10);
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (matches.length > 0) {
          state.heroSearchIndex = (state.heroSearchIndex + 1) % matches.length;
          renderHeroSearchDropdown();
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (matches.length > 0) {
          state.heroSearchIndex = (state.heroSearchIndex - 1 + matches.length) % matches.length;
          renderHeroSearchDropdown();
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const picked = matches[state.heroSearchIndex >= 0 ? state.heroSearchIndex : 0];
        if (picked) {
          selectNote(picked.path);
        }
      }
    }

    function updateNoteSwitcherUI() {
      const selectEl = document.getElementById('note-switcher-select');
      const posEl = document.getElementById('note-position-indicator');
      const prevBtn = document.getElementById('btn-prev-note');
      const nextBtn = document.getElementById('btn-next-note');
      const footerPrevBtn = document.getElementById('footer-prev-btn');
      const footerNextBtn = document.getElementById('footer-next-btn');
      const footerPrevTitle = document.getElementById('footer-prev-title');
      const footerNextTitle = document.getElementById('footer-next-title');

      const total = state.files.length;
      const currentIdx = state.files.findIndex(f => f.path === state.activePath);

      if (selectEl) {
        if (total === 0) {
          selectEl.innerHTML = `<option value="">No notes</option>`;
        } else {
          selectEl.innerHTML = state.files.map(f => {
            const label = f.path.replace(/\.(md|markdown|mdx)$/i, '');
            const selected = f.path === state.activePath ? 'selected' : '';
            return `<option value="${escapeHtml(f.path)}" ${selected}>${escapeHtml(label)}</option>`;
          }).join('');
        }
      }

      if (posEl) {
        posEl.textContent = currentIdx >= 0 ? `${currentIdx + 1} / ${total}` : `0 / ${total}`;
      }

      const hasPrev = currentIdx > 0;
      const hasNext = currentIdx >= 0 && currentIdx < total - 1;

      if (prevBtn) prevBtn.disabled = !hasPrev;
      if (nextBtn) nextBtn.disabled = !hasNext;
      if (footerPrevBtn) footerPrevBtn.disabled = !hasPrev;
      if (footerNextBtn) footerNextBtn.disabled = !hasNext;

      if (footerPrevTitle) {
        footerPrevTitle.textContent = hasPrev
          ? state.files[currentIdx - 1].path.split('/').pop().replace(/\.(md|markdown|mdx|txt)$/i, '')
          : 'Start of vault';
      }
      if (footerNextTitle) {
        footerNextTitle.textContent = hasNext
          ? state.files[currentIdx + 1].path.split('/').pop().replace(/\.(md|markdown|mdx|txt)$/i, '')
          : 'End of vault';
      }
    }

    function switchNoteByOffset(offset) {
      if (!state.files.length) return;
      const currentIdx = state.files.findIndex(f => f.path === state.activePath);
      const nextIdx = currentIdx + offset;
      if (nextIdx >= 0 && nextIdx < state.files.length) {
        selectNote(state.files[nextIdx].path);
      }
    }

    function getFilteredFiles() {
      if (!state.searchQuery) return state.files;
      const q = state.searchQuery;
      return state.files.filter(file => {
        if (file.path.toLowerCase().includes(q)) return true;
        const cached = state.contentCache[file.path];
        return cached && cached.toLowerCase().includes(q);
      });
    }

    function renderFileTree() {
      const container = document.getElementById('file-tree-container');
      if (!container) return;

      const filtered = getFilteredFiles();
      if (filtered.length === 0) {
        container.innerHTML = `<div class="px-2.5 py-3 text-xs text-muted">No matching notes</div>`;
        return;
      }

      const root = { folders: {}, files: [] };
      filtered.forEach(file => {
        const parts = file.path.split('/');
        let curr = root;
        for (let i = 0; i < parts.length - 1; i++) {
          const folderName = parts[i];
          const folderPath = parts.slice(0, i + 1).join('/');
          if (!curr.folders[folderName]) {
            curr.folders[folderName] = { name: folderName, path: folderPath, folders: {}, files: [] };
          }
          curr = curr.folders[folderName];
        }
        curr.files.push(file);
      });

      const renderNode = (node, depth = 0) => {
        let html = '';
        const folderNames = Object.keys(node.folders).sort((a, b) => a.localeCompare(b));

        folderNames.forEach(fname => {
          const folder = node.folders[fname];
          const isOpen = state.searchQuery.length > 0 || state.expandedFolders.has(folder.path);
          const padLeft = depth * 12 + 8;

          html += `
            <div>
              <button
                type="button"
                onclick="toggleFolder('${escapeHtml(folder.path)}')"
                style="padding-left: ${padLeft}px"
                class="w-full py-2.5 sm:py-1.5 pr-2 rounded-lg sm:rounded text-left text-[13px] sm:text-xs text-prose hover:text-ink hover:bg-elevated/70 active:bg-elevated flex items-center gap-1.5 transition"
              >
                <span class="text-[10px] text-muted w-3.5 inline-block">${isOpen ? '▾' : '▸'}</span>
                <span class="truncate font-medium">${escapeHtml(folder.name)}</span>
              </button>
              <div class="${isOpen ? '' : 'hidden'}">
                ${renderNode(folder, depth + 1)}
              </div>
            </div>
          `;
        });

        node.files.forEach(file => {
          const label = file.path.split('/').pop().replace(/\.(md|markdown|mdx)$/i, '');
          const isActive = file.path === state.activePath;
          const padLeft = depth * 12 + 20;

          html += `
            <button
              type="button"
              onclick="selectNote('${escapeHtml(file.path)}')"
              style="padding-left: ${padLeft}px"
              class="w-full py-2.5 sm:py-1.5 pr-2 rounded-lg sm:rounded text-left text-[13px] sm:text-xs truncate block transition ${
                isActive
                  ? 'text-accent bg-accent/10 font-medium'
                  : 'text-muted hover:text-ink hover:bg-elevated/60 active:bg-elevated'
              }"
            >
              ${escapeHtml(label)}
            </button>
          `;
        });

        return html;
      };

      container.innerHTML = renderNode(root, 0);
    }

    function toggleFolder(folderPath) {
      if (state.expandedFolders.has(folderPath)) {
        state.expandedFolders.delete(folderPath);
      } else {
        state.expandedFolders.add(folderPath);
      }
      renderFileTree();
    }

    // =========================================================================
    // 7. INTERACTIVE KNOWLEDGE GRAPH VIEW (D3.js)
    // =========================================================================
    function toggleGraphView(forceState) {
      const next = typeof forceState === 'boolean' ? forceState : !state.graphOpen;
      state.graphOpen = next;

      const readerEl = document.getElementById('reader-scroll-container');
      const graphEl = document.getElementById('graph-view-container');
      const btnEl = document.getElementById('btn-toggle-graph');

      if (readerEl) readerEl.classList.toggle('hidden', next);
      if (graphEl) graphEl.classList.toggle('hidden', !next);
      if (btnEl) btnEl.classList.toggle('text-accent', next);

      if (next) {
        openGraphAndIndex();
      } else if (state.graphSimulation) {
        state.graphSimulation.stop();
      }
    }

    function toggleGraphScope() {
      state.graphLocalOnly = !state.graphLocalOnly;
      const scopeBtn = document.getElementById('btn-graph-scope');
      if (scopeBtn) {
        scopeBtn.textContent = state.graphLocalOnly ? 'local note' : 'full vault';
      }
      renderKnowledgeGraph();
    }

    function resetGraphZoom() {
      if (typeof d3 === 'undefined' || !state.graphZoomBehavior) return;
      const svg = d3.select('#knowledge-graph-svg');
      svg.transition().duration(300).call(state.graphZoomBehavior.transform, d3.zoomIdentity);
    }

    async function openGraphAndIndex() {
      renderKnowledgeGraph();

      if (state.isDemoMode || state.isIndexingGraph) return;
      const uncached = state.files.filter(f => !Object.prototype.hasOwnProperty.call(state.contentCache, f.path));
      if (uncached.length === 0) return;

      state.isIndexingGraph = true;
      const badge = document.getElementById('graph-indexing-badge');
      if (badge) badge.classList.remove('hidden');

      try {
        // Index up to 40 notes in small batches to discover all links
        const batch = uncached.slice(0, 40);
        for (const file of batch) {
          if (!state.graphOpen) break;
          await fetchNoteContent(file.path).catch(() => '');
        }
      } finally {
        state.isIndexingGraph = false;
        if (badge) badge.classList.add('hidden');
        if (state.graphOpen) {
          renderKnowledgeGraph();
        }
      }
    }

    function buildGraphData() {
      const nodes = state.files.map(f => ({
        id: f.path,
        label: f.path.split('/').pop().replace(/\.(md|markdown|mdx|txt)$/i, '')
      }));
      const nodeSet = new Set(nodes.map(n => n.id));
      const links = [];
      const edgeKeys = new Set();

      state.files.forEach(file => {
        const content = state.contentCache[file.path];
        if (!content) return;

        // Extract [[WikiLinks]]
        const wikiMatches = content.matchAll(/\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|[^\]]+)?\]\]/g);
        for (const m of wikiMatches) {
          const resolved = resolveWikiTarget(m[1]);
          if (resolved && resolved !== file.path && nodeSet.has(resolved)) {
            const key = `${file.path}->${resolved}`;
            if (!edgeKeys.has(key)) {
              edgeKeys.add(key);
              links.push({ source: file.path, target: resolved });
            }
          }
        }

        // Extract relative Markdown links [text](note.md)
        const mdMatches = content.matchAll(/\[[^\]]+\]\(([^)#\s]+)(?:#[^)]+)?\)/g);
        for (const m of mdMatches) {
          const href = m[1];
          if (/^https?:\/\//i.test(href)) continue;
          const resolved = resolveRelativePath(file.path, href);
          const matched = state.files.find(f => f.path.toLowerCase() === resolved.toLowerCase());
          if (matched && matched.path !== file.path) {
            const key = `${file.path}->${matched.path}`;
            if (!edgeKeys.has(key)) {
              edgeKeys.add(key);
              links.push({ source: file.path, target: matched.path });
            }
          }
        }
      });

      if (state.graphLocalOnly && state.activePath) {
        const neighbors = new Set([state.activePath]);
        links.forEach(l => {
          if (l.source === state.activePath) neighbors.add(l.target);
          if (l.target === state.activePath) neighbors.add(l.source);
        });
        return {
          nodes: nodes.filter(n => neighbors.has(n.id)),
          links: links.filter(l => neighbors.has(l.source) && neighbors.has(l.target))
        };
      }

      return { nodes, links };
    }

    function renderKnowledgeGraph() {
      const container = document.getElementById('graph-view-container');
      const svgEl = document.getElementById('knowledge-graph-svg');
      const statsEl = document.getElementById('graph-stats-label');
      if (!container || !svgEl || typeof d3 === 'undefined') return;

      const { nodes, links } = buildGraphData();
      if (statsEl) {
        statsEl.textContent = `${nodes.length} nodes · ${links.length} links`;
      }

      const width = container.clientWidth || 640;
      const height = container.clientHeight || 480;

      const svg = d3.select(svgEl);
      svg.selectAll('*').remove();

      const g = svg.append('g');
      const zoom = d3.zoom()
        .scaleExtent([0.25, 3.5])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });
      svg.call(zoom);
      state.graphZoomBehavior = zoom;

      if (state.graphSimulation) {
        state.graphSimulation.stop();
      }

      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(85))
        .force('charge', d3.forceManyBody().strength(-210))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide(24));

      state.graphSimulation = simulation;

      const link = g.append('g')
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('stroke', '#252130')
        .attr('stroke-width', 1.2);

      const node = g.append('g')
        .selectAll('g')
        .data(nodes)
        .join('g')
        .style('cursor', 'pointer')
        .call(
          d3.drag()
            .on('start', (event, d) => {
              if (!event.active) simulation.alphaTarget(0.3).restart();
              d.fx = d.x;
              d.fy = d.y;
            })
            .on('drag', (event, d) => {
              d.fx = event.x;
              d.fy = event.y;
            })
            .on('end', (event, d) => {
              if (!event.active) simulation.alphaTarget(0);
              d.fx = null;
              d.fy = null;
            })
        )
        .on('click', (_, d) => {
          toggleGraphView(false);
          selectNote(d.id);
        })
        .on('mouseenter', (_, d) => {
          const connected = new Set([d.id]);
          links.forEach(l => {
            const s = typeof l.source === 'object' ? l.source.id : l.source;
            const t = typeof l.target === 'object' ? l.target.id : l.target;
            if (s === d.id) connected.add(t);
            if (t === d.id) connected.add(s);
          });
          node.attr('opacity', n => (connected.has(n.id) ? 1 : 0.25));
          link
            .attr('stroke', l => {
              const s = typeof l.source === 'object' ? l.source.id : l.source;
              const t = typeof l.target === 'object' ? l.target.id : l.target;
              return s === d.id || t === d.id ? '#A78BFA' : '#252130';
            })
            .attr('stroke-opacity', l => {
              const s = typeof l.source === 'object' ? l.source.id : l.source;
              const t = typeof l.target === 'object' ? l.target.id : l.target;
              return s === d.id || t === d.id ? 0.9 : 0.25;
            });
        })
        .on('mouseleave', () => {
          node.attr('opacity', 1);
          link.attr('stroke', '#252130').attr('stroke-opacity', 1);
        });

      node.append('circle')
        .attr('r', d => {
          const isMobile = width < 640;
          return d.id === state.activePath ? (isMobile ? 8 : 6.5) : (isMobile ? 6 : 4.5);
        })
        .attr('fill', d => (d.id === state.activePath ? '#A78BFA' : '#EAE8F0'))
        .attr('stroke', '#0E0D12')
        .attr('stroke-width', 1.5);

      node.append('text')
        .text(d => d.label)
        .attr('x', 9)
        .attr('y', 3.5)
        .attr('fill', d => (d.id === state.activePath ? '#A78BFA' : '#A6A2B3'))
        .style('font-family', 'Inter, sans-serif')
        .style('font-size', '11px');

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });
    }

    // =========================================================================
    // 8. UI HELPERS (SIDEBAR, MODAL, TOAST, CLIPBOARD)
    // =========================================================================
    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('left-sidebar');
      const backdrop = document.getElementById('mobile-backdrop');
      if (!sidebar) return;

      const isDesktop = window.innerWidth >= 1024;
      if (isDesktop) {
        const nextCollapsed = typeof forceState === 'boolean' ? !forceState : !state.sidebarCollapsed;
        state.sidebarCollapsed = nextCollapsed;
        sidebar.classList.toggle('lg:hidden', nextCollapsed);
        if (state.graphOpen) renderKnowledgeGraph();
      } else {
        const isCurrentlyOpen = !sidebar.classList.contains('-translate-x-full');
        const nextOpen = typeof forceState === 'boolean' ? forceState : !isCurrentlyOpen;
        sidebar.classList.toggle('-translate-x-full', !nextOpen);
        if (backdrop) backdrop.classList.toggle('hidden', !nextOpen);
      }
    }

    function openSetupModal() {
      const modal = document.getElementById('setup-modal');
      if (!modal) return;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSetupModal() {
      const modal = document.getElementById('setup-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setLoadingState(loading) {
      const loader = document.getElementById('reader-loader');
      const mdEl = document.getElementById('markdown-output');
      if (loader) loader.classList.toggle('hidden', !loading);
      if (mdEl && loading) mdEl.innerHTML = '';
    }

    function showBanner(msg) {
      const banner = document.getElementById('status-banner');
      const msgEl = document.getElementById('status-banner-msg');
      if (msgEl) msgEl.textContent = msg;
      if (banner) banner.classList.remove('hidden');
    }

    function hideBanner() {
      const banner = document.getElementById('status-banner');
      if (banner) banner.classList.add('hidden');
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      if (!toast || !msgEl) return;

      msgEl.textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2200);
    }

    function copyTextFallback(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        // Ignore copy failure
      }
      document.body.removeChild(ta);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Explicitly expose all inline HTML handlers on window
    Object.assign(window, {
      toggleSidebar,
      openSetupModal,
      closeSetupModal,
      saveAndConnectRepo,
      discoverUserRepos,
      pickDiscoveredRepo,
      activateDemoMode,
      refreshRepository,
      selectNote,
      toggleFolder,
      toggleRawView,
      toggleForceMarkdownOnTxt,
      toggleGraphView,
      toggleGraphScope,
      resetGraphZoom,
      hideBanner,
      switchNoteByOffset,
      updateNoteSwitcherUI,
      handleSearchInput,
      clearSearch,
      openHeroSearchResults,
      closeHeroSearchResults,
      handleHeroSearchKeydown
    });
  </script>
</body>
